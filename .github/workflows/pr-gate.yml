name: pr-gate

# Labels a pull request whose author cannot push to the project and that links no issue, so a
# maintainer agrees on an issue before the review. It asks the author's permission, since
# author_association misses a private org membership. This workflow never checks out the pull
# request's code.
on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          permission=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission || true)
          case "$permission" in
            admin | write) exit 0 ;;
          esac
          if printf '%s\n' "$BODY" | grep -Eiq '(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+'; then
            exit 0
          fi
          gh api --method POST "repos/$REPO/issues/$NUMBER/labels" -f 'labels[]=needs-issue' > /dev/null
          gh api --method POST "repos/$REPO/issues/$NUMBER/comments" \
            -f body="Thanks for the change! headcoach takes bugs and ideas as issues first, see CONTRIBUTING.md. A maintainer reviews this pull request once an issue agreed on it." > /dev/null
